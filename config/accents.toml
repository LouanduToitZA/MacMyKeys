# Hold a letter this long before the accent row appears.
hold_ms = 300

# Steps are compose-key tokens. The daemon taps Caps Lock (the compose key),
# then each step. A shifted letter uses the capital compose sequence.

[[letter]]
key = "a"
[[letter.variant]]
text = "à"
steps = ["grave", "a"]
[[letter.variant]]
text = "á"
steps = ["apostrophe", "a"]
[[letter.variant]]
text = "â"
steps = ["asciicircum", "a"]
[[letter.variant]]
text = "ä"
steps = ["quotedbl", "a"]
[[letter.variant]]
text = "æ"
steps = ["a", "e"]
[[letter.variant]]
text = "ã"
steps = ["asciitilde", "a"]
[[letter.variant]]
text = "å"
steps = ["o", "a"]
[[letter.variant]]
text = "ā"
steps = ["minus", "a"]

